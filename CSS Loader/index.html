<!Doctype html>
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pure Css Loader</title>
	<style>
		body {
		    margin: 0;
		    padding: 0;
		    height: 100vh;
		    display: flex;
		    justify-content: center;
		    align-items: center;
		}
		.cs-spinner,
		.cs-spinner div,
		.cs-spinner div:after {
		  box-sizing: border-box;
		}
		.cs-spinner {
		  color: currentColor;
		  display: inline-block;
		  position: relative;
		  width: 80px;
		  height: 80px;
		}
		.cs-spinner div {
		  transform-origin: 40px 40px;
		  animation: cs-spinner 1.2s linear infinite;
		}
		.cs-spinner div:after {
		  content: " ";
		  display: block;
		  position: absolute;
		  top: 3.2px;
		  left: 36.8px;
		  width: 6.4px;
		  height: 17.6px;
		  border-radius: 20%;
		  background: currentColor;
		}
		.cs-spinner div:nth-child(1) {
		  transform: rotate(0deg);
		  animation-delay: -1.1s;
		}
		.cs-spinner div:nth-child(2) {
		  transform: rotate(30deg);
		  animation-delay: -1s;
		}
		.cs-spinner div:nth-child(3) {
		  transform: rotate(60deg);
		  animation-delay: -0.9s;
		}
		.cs-spinner div:nth-child(4) {
		  transform: rotate(90deg);
		  animation-delay: -0.8s;
		}
		.cs-spinner div:nth-child(5) {
		  transform: rotate(120deg);
		  animation-delay: -0.7s;
		}
		.cs-spinner div:nth-child(6) {
		  transform: rotate(150deg);
		  animation-delay: -0.6s;
		}
		.cs-spinner div:nth-child(7) {
		  transform: rotate(180deg);
		  animation-delay: -0.5s;
		}
		.cs-spinner div:nth-child(8) {
		  transform: rotate(210deg);
		  animation-delay: -0.4s;
		}
		.cs-spinner div:nth-child(9) {
		  transform: rotate(240deg);
		  animation-delay: -0.3s;
		}
		.cs-spinner div:nth-child(10) {
		  transform: rotate(270deg);
		  animation-delay: -0.2s;
		}
		.cs-spinner div:nth-child(11) {
		  transform: rotate(300deg);
		  animation-delay: -0.1s;
		}
		.cs-spinner div:nth-child(12) {
		  transform: rotate(330deg);
		  animation-delay: 0s;
		}
		@keyframes cs-spinner {
		  0% {
		    opacity: 1;
		  }
		  100% {
		    opacity: 0;
		  }
		}
	</style>
</head>
<body>
	<div class="cs-spinner">
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</div>
</body>
</html>
